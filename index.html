<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>✈️ 2P 분할화면 도그파이트 — WebGL</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 시작화면: 각 플레이어 색 선택(중복불가) → 시작 -->
  <div id="start-overlay">
    <h1>✈️ 도그파이트</h1>
    <p class="sub">각자 비행기 색을 고르세요 (같은 색 불가)</p>
    <div class="picker">
      <div class="player-pick">
        <div class="pick-title">P1 <span class="keys">WASD</span></div>
        <div id="p1-colors" class="swatches"></div>
      </div>
      <div class="player-pick">
        <div class="pick-title">P2 <span class="keys">↑↓←→</span></div>
        <div id="p2-colors" class="swatches"></div>
      </div>
    </div>
    <button id="start-btn" disabled>시작</button>
    <div class="controls">
      <b>P1</b> WASD 조종 · Shift 부스터 · Q 감속 · E 기관총 · R 미사일 · F 플레어 &nbsp;|&nbsp;
      <b>P2</b> 방향키 · RShift 부스터 · / 감속 · . 기관총 · , 미사일 · RCtrl·M 플레어 &nbsp;|&nbsp;
      <b>`</b> 음소거
    </div>
  </div>

  <!-- 결과창: 승자 + 재대결 -->
  <div id="result-overlay" class="hidden">
    <h1 id="result-title">P1 승리</h1>
    <div class="result-btns">
      <button id="rematch-btn">재대결</button>
      <button id="recolor-btn">색 다시 고르기</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
